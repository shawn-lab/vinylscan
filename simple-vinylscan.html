<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylScan - 黑胶唱片信息扫描工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 0;
      border-bottom: 1px solid #181818;
      margin-bottom: 32px;
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .logo-icon { 
      width: 32px; 
      height: 32px; 
      background-color: #1DB954; 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-weight: bold;
      color: #000;
    }
    nav { display: flex; gap: 16px; }
    nav a { 
      text-decoration: none; 
      color: #B3B3B3; 
      padding: 8px 16px; 
      border-radius: 20px;
      transition: all 0.2s;
    }
    nav a:hover, nav a.active { 
      color: #fff; 
      background-color: #1DB954;
    }
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 { font-size: 48px; margin-bottom: 16px; }
    .hero p { color: #B3B3B3; margin-bottom: 32px; }
    .search-box { 
      display: flex; 
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #181818;
      border-radius: 30px;
      padding: 8px;
    }
    .search-box input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      outline: none;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
    }
    .search-box button { 
      background-color: #1DB954;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .search-box button:hover { background-color: #1ed760; }
    .quick-actions { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
    .quick-btn { 
      padding: 12px 24px; 
      background-color: #181818;
      border: none;
      border-radius: 25px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .quick-btn:hover { background-color: #282828; }
    .results { margin-top: 48px; }
    .results h2 { font-size: 24px; margin-bottom: 24px; }
    .album-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 24px;
    }
    .album-card { 
      background-color: #181818; 
      border-radius: 8px; 
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .album-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .album-cover { 
      width: 100%; 
      aspect-ratio: 1; 
      background-color: #282828;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .album-cover img { width: 100%; height: 100%; object-fit: cover; }
    .album-info { padding: 12px; }
    .album-title { font-weight: bold; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .album-artist { color: #B3B3B3; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .album-year { color: #666; font-size: 12px; }
    .detail-page { display: none; }
    .detail-page.active { display: block; }
    .detail-content { 
      display: grid; 
      grid-template-columns: 1fr 2fr; 
      gap: 48px;
      margin-top: 32px;
    }
    .detail-cover img { width: 100%; border-radius: 8px; }
    .detail-info h1 { font-size: 48px; margin-bottom: 16px; }
    .detail-info h2 { color: #B3B3B3; margin-bottom: 24px; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .detail-tag { 
      padding: 6px 16px; 
      background-color: #181818; 
      border-radius: 20px;
      font-size: 14px;
    }
    .tracklist { background-color: #181818; border-radius: 8px; padding: 24px; }
    .tracklist h3 { margin-bottom: 20px; }
    .track { 
      display: flex; 
      justify-content: space-between; 
      padding: 12px 0;
      border-bottom: 1px solid #282828;
    }
    .track:last-child { border-bottom: none; }
    .track-number { color: #666; margin-right: 16px; }
    .track-title { flex: 1; }
    .track-duration { color: #666; }
    .back-link { 
      color: #1DB954; 
      text-decoration: none; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .toast { 
      position: fixed; 
      top: 20px; 
      right: 20px;
      background-color: #181818;
      padding: 16px 24px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
    .toast.show { display: block; animation: slideIn 0.3s; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .favorites-page, .history-page, .settings-page { display: none; }
    .favorites-page.active, .history-page.active, .settings-page.active { display: block; }
    .empty-state { text-align: center; padding: 64px 0; }
    .empty-state .icon { font-size: 64px; color: #666; margin-bottom: 16px; }
    .empty-state h2 { margin-bottom: 8px; }
    .empty-state p { color: #666; }
    .empty-state a { color: #1DB954; text-decoration: none; }
    .settings-form { max-width: 600px; margin: 0 auto; }
    .settings-form h2 { margin-bottom: 32px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: bold;
    }
    .form-group input { 
      width: 100%; 
      padding: 12px 16px;
      background-color: #181818;
      border: 1px solid #282828;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .form-group input:focus { border-color: #1DB954; }
    .form-group .hint { color: #666; font-size: 12px; margin-top: 8px; }
    .settings-actions { display: flex; gap: 16px; }
    .btn-primary { 
      background-color: #1DB954; 
      color: #000; 
      border: none; 
      padding: 12px 32px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-danger { 
      background-color: transparent; 
      color: #ff4444; 
      border: 1px solid #ff4444; 
      padding: 12px 32px;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn-primary:hover { background-color: #1ed760; }
    .btn-danger:hover { background-color: rgba(255,68,68,0.1); }
    .favorite-btn { 
      width: 100%; 
      padding: 12px; 
      margin-top: 16px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .favorite-btn.favorited { background-color: #1DB954; color: #000; }
    .favorite-btn:not(.favorited) { background-color: #282828; color: #fff; }
    .favorite-btn:hover { opacity: 0.9; }
    .tabs { border-bottom: 1px solid #282828; margin-bottom: 24px; }
    .tab { 
      padding: 12px 24px; 
      border: none; 
      background: none; 
      color: #666; 
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tab.active { color: #1DB954; border-bottom-color: #1DB954; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 手机端适配 */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      header { padding: 12px 0; margin-bottom: 20px; }
      .logo-icon { width: 28px; height: 28px; font-size: 14px; }
      .logo span { font-size: 18px !important; }
      nav { gap: 8px; }
      nav a { padding: 6px 12px; font-size: 14px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; margin-bottom: 20px; }
      .search-box { flex-direction: column; border-radius: 16px; }
      .search-box input { padding: 10px 16px; font-size: 16px; }
      .search-box button { width: 100%; margin-top: 8px; }
      .quick-actions { flex-direction: column; gap: 8px; }
      .quick-btn { width: 100%; justify-content: center; padding: 10px 16px; font-size: 14px; }
      .album-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .album-card { border-radius: 6px; }
      .album-info { padding: 8px; }
      .album-title { font-size: 14px; }
      .album-artist { font-size: 12px; }
      .album-year { font-size: 10px; }
      .detail-content { grid-template-columns: 1fr; gap: 24px; }
      .detail-info h1 { font-size: 24px; }
      .detail-info h2 { font-size: 16px; }
      .detail-tags { gap: 6px; }
      .detail-tag { padding: 4px 10px; font-size: 12px; }
      .tabs { display: flex; overflow-x: auto; }
      .tab { padding: 10px 16px; font-size: 14px; white-space: nowrap; }
      .track { padding: 8px 0; font-size: 14px; }
      .track-number { width: 24px; margin-right: 8px; font-size: 12px; }
      .track-duration { font-size: 12px; }
      .settings-form { padding: 0 8px; }
      .settings-form h1 { font-size: 24px; }
      .form-group input { padding: 10px 12px; font-size: 16px; }
      .btn-primary, .btn-danger { padding: 10px 24px; font-size: 14px; }
      .favorite-btn { padding: 10px; font-size: 14px; }
      .empty-state { padding: 40px 0; }
      .empty-state .icon { font-size: 48px; }
      .empty-state h2 { font-size: 20px; }
    }

    @media (max-width: 480px) {
      .album-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .hero h1 { font-size: 24px; }
      nav a { padding: 4px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">V</div>
        <span style="font-size: 24px; font-weight: bold;">VinylScan</span>
      </div>
      <nav>
        <a href="#" id="nav-home" class="active" onclick="showPage('home')">搜索</a>
        <a href="#" id="nav-favorites" onclick="showPage('favorites')">收藏</a>
        <a href="#" id="nav-history" onclick="showPage('history')">历史</a>
        <a href="#" id="nav-settings" onclick="showPage('settings')">设置</a>
      </nav>
    </header>

    <div id="page-home">
      <div class="hero">
        <h1>探索黑胶唱片</h1>
        <p>输入艺术家或专辑名，快速获取专辑信息</p>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="输入艺术家或专辑名..." onkeypress="if(event.key=='Enter') search()">
          <button onclick="search()">搜索</button>
        </div>
        <div class="quick-actions">
          <button class="quick-btn" onclick="openLinkModal()">🔗 粘贴链接</button>
          <label class="quick-btn" style="cursor: pointer;">📷 拍照识别
            <input type="file" accept="image/*" capture="environment" style="display: none;" onchange="handleImageUpload(event)">
          </label>
          <label class="quick-btn" style="cursor: pointer;">📁 上传封面
            <input type="file" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
          </label>
        </div>
      </div>

      <div class="results" id="results" style="display: none;">
        <h2>搜索结果</h2>
        <div class="album-grid" id="album-grid"></div>
      </div>

      <div id="no-results" style="display: none; text-align: center; padding: 48px;">
        <p style="color: #B3B3B3;">未找到相关专辑</p>
      </div>
    </div>

    <div id="page-detail" class="detail-page">
      <a href="#" class="back-link" onclick="showPage('home'); return false;">← 返回搜索</a>
      <div class="detail-content" id="detail-content"></div>
    </div>

    <div id="page-favorites" class="favorites-page">
      <h1 style="margin-bottom: 24px;">我的收藏</h1>
      <div id="favorites-list"></div>
    </div>

    <div id="page-history" class="history-page">
      <h1 style="margin-bottom: 24px;">历史记录</h1>
      <div id="history-list"></div>
    </div>

    <div id="page-settings" class="settings-page">
      <div class="settings-form">
        <h1>设置</h1>
        <div class="form-group">
          <label>Discogs Token <span style="color: #ff4444;">*</span></label>
          <input type="password" id="discogs-token" placeholder="请输入 Discogs Personal Access Token">
          <div class="hint">在 Discogs 设置页面生成 Personal Access Token</div>
        </div>
        <div class="form-group">
          <label>智谱 AI Key</label>
          <input type="password" id="zhipu-key" placeholder="请输入智谱 AI API Key">
          <div class="hint">用于 AI 文字识别和翻译功能</div>
        </div>
        <div class="settings-actions">
          <button class="btn-primary" onclick="saveSettings()">保存设置</button>
          <button class="btn-danger" onclick="resetSettings()">重置</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div id="link-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
      <div style="background: #181818; padding: 32px; border-radius: 12px; width: 90%; max-width: 400px;">
        <h3 style="margin-bottom: 24px; font-size: 20px;">粘贴链接</h3>
        <input type="text" id="link-input" style="width: 100%; padding: 12px; margin-bottom: 16px; background: #121212; border: 1px solid #282828; border-radius: 8px; color: #fff;" placeholder="粘贴 Discogs、网易云或 Spotify 链接...">
        <div style="color: #666; font-size: 12px; margin-bottom: 24px;">
          <p>支持的链接：</p>
          <p>• Discogs: discogs.com/.../release/123456</p>
          <p>• 网易云音乐: music.163.com/...album?id=123</p>
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="handleLinkSubmit()">确认</button>
        <button style="width: 100%; margin-top: 12px; padding: 12px; background: transparent; border: 1px solid #282828; border-radius: 25px; color: #fff; cursor: pointer;" onclick="closeLinkModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    const DISCOGS_API = 'https://api.discogs.com';
    const STORAGE_KEYS = {
      DISCOGS_TOKEN: 'vinylscan_discogs_token',
      ZHIPU_KEY: 'vinylscan_zhipu_key',
      FAVORITES: 'vinylscan_favorites',
      HISTORY: 'vinylscan_history'
    };

    function getToken() {
      return localStorage.getItem(STORAGE_KEYS.DISCOGS_TOKEN) || '';
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.backgroundColor = type === 'success' ? '#1DB954' : type === 'error' ? '#ff4444' : '#181818';
      toast.style.color = type === 'success' || type === 'error' ? '#000' : '#fff';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showPage(page) {
      document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(el => el.classList.remove('active'));
      document.getElementById(`page-${page}`)?.classList.add('active');
      document.getElementById(`nav-${page}`)?.classList.add('active');
      
      if (page === 'favorites') loadFavorites();
      if (page === 'history') loadHistory();
    }

    async function search() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      
      const token = getToken();
      if (!token) {
        showToast('请先在设置页面配置 Discogs Token', 'error');
        return;
      }

      document.getElementById('results').style.display = 'none';
      document.getElementById('no-results').style.display = 'none';

      try {
        const res = await fetch(`${DISCOGS_API}/database/search?q=${encodeURIComponent(query)}&type=release&per_page=8`, {
          headers: { 
            'Authorization': `Discogs token=${token}`, 
            'User-Agent': 'VinylScan/1.0 - VinylScanner/1.0',
            'Accept': 'application/json'
          }
        });
        
        if (!res.ok) {
          if (res.status === 401) {
            throw new Error('Token无效，请检查Discogs Token是否正确');
          } else if (res.status === 429) {
            throw new Error('请求过于频繁，请稍后再试');
          } else {
            throw new Error(`搜索失败 (${res.status})`);
          }
        }
        const data = await res.json();
        
        if (data.results.length === 0) {
          document.getElementById('no-results').style.display = 'block';
          return;
        }

        const grid = document.getElementById('album-grid');
        grid.innerHTML = data.results.map(item => `
          <div class="album-card" onclick="showAlbum('${item.id}')">
            <div class="album-cover">
              ${item.cover_image ? `<img src="${item.cover_image}" alt="${item.title}">` : '<span style="color: #666;">🎵</span>'}
            </div>
            <div class="album-info">
              <div class="album-title">${item.title}</div>
              <div class="album-artist">${item.artist || 'Unknown'}</div>
              <div class="album-year">${item.year || 'Unknown'}</div>
            </div>
          </div>
        `).join('');
        
        document.getElementById('results').style.display = 'block';
      } catch (err) {
        console.error('Search error:', err);
        const errorMsg = err.message || '搜索失败，请检查网络和 Discogs Token';
        showToast(errorMsg, 'error');
      }
    }

    async function showAlbum(id) {
      const token = getToken();
      if (!token) {
        showToast('请先配置 Discogs Token', 'error');
        return;
      }

      showToast('正在加载专辑详情...', 'info');

      try {
        const res = await fetch(`${DISCOGS_API}/releases/${id}`, {
          headers: { 
            'Authorization': `Discogs token=${token}`, 
            'User-Agent': 'VinylScan/1.0 - VinylScanner/1.0',
            'Accept': 'application/json'
          }
        });
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error('Discogs API Error:', res.status, errorText);
          if (res.status === 401) {
            throw new Error('Token无效，请检查Discogs Token是否正确');
          } else if (res.status === 404) {
            throw new Error('专辑不存在或已被删除');
          } else if (res.status === 429) {
            throw new Error('请求过于频繁，请稍后再试');
          } else {
            throw new Error(`获取详情失败 (${res.status})`);
          }
        }
        const data = await res.json();

        const favorites = getFavorites();
        const isFavorited = favorites.some(f => f.id === id);
        
        const detail = document.getElementById('detail-content');
        detail.innerHTML = `
          <div>
            <div class="detail-cover">
              <img src="${data.images?.[0]?.uri || ''}" alt="${data.title}">
            </div>
            <button class="favorite-btn ${isFavorited ? 'favorited' : ''}" onclick="toggleFavorite(${JSON.stringify(data)})">
              ❤️ ${isFavorited ? '已收藏' : '收藏'}
            </button>
          </div>
          <div class="detail-info">
            <h1>${data.title}</h1>
            <h2>${data.artists?.map(a => a.name).join(', ') || 'Unknown Artist'}</h2>
            <div class="detail-tags">
              ${data.year ? `<span class="detail-tag">${data.year}</span>` : ''}
              ${data.genres?.map(g => `<span class="detail-tag">${g}</span>`).join('') || ''}
              ${data.community?.rating?.average ? `<span class="detail-tag" style="background: #1DB954; color: #000;">★ ${data.community.rating.average}</span>` : ''}
            </div>
            <div class="tabs">
              <button class="tab active" onclick="showTab('tracks')">曲目</button>
              <button class="tab" onclick="showTab('info')">详情</button>
              <button class="tab" onclick="showTab('ai')">AI 搜索</button>
            </div>
            <div class="tracklist tab-content active" id="tab-tracks">
              <h3>曲目列表</h3>
              ${data.tracklist?.map((t, i) => `
                <div class="track">
                  <span class="track-number">${t.position || i + 1}</span>
                  <span class="track-title">${t.title}</span>
                  <span class="track-duration">${t.duration || ''}</span>
                </div>
              `).join('') || '<p style="color: #666;">暂无曲目信息</p>'}
            </div>
            <div class="tracklist tab-content" id="tab-info">
              <h3>专辑介绍</h3>
              <p style="color: #B3B3B3;">${data.released_formatted || '暂无详细信息'}</p>
              ${data.labels?.length ? `<p style="margin-top: 16px;"><strong>厂牌:</strong> ${data.labels.map(l => l.name).join(', ')}</p>` : ''}
              ${data.uri ? `<p style="margin-top: 8px;"><a href="${data.uri}" target="_blank" style="color: #1DB954;">在 Discogs 查看</a></p>` : ''}
            </div>
            <div class="tracklist tab-content" id="tab-ai">
              <h3>🤖 AI 搜索</h3>
              <p style="color: #B3B3B3;">AI 搜索功能开发中，请稍后再试</p>
            </div>
          </div>
        `;

        showPage('detail');
        addToHistory(data);
      } catch (err) {
        console.error('Album detail error:', err);
        const errorMsg = err.message || '未知错误';
        showToast(errorMsg, 'error');
      }
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab:nth-child(${tab === 'tracks' ? 1 : tab === 'info' ? 2 : 3})`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.FAVORITES) || '[]');
    }

    function saveFavorites(favorites) {
      localStorage.setItem(STORAGE_KEYS.FAVORITES, JSON.stringify(favorites));
    }

    function toggleFavorite(album) {
      const favorites = getFavorites();
      const index = favorites.findIndex(f => f.id === String(album.id));
      
      if (index > -1) {
        favorites.splice(index, 1);
        showToast('已取消收藏');
      } else {
        favorites.push({
          id: String(album.id),
          title: album.title,
          artist: album.artists?.map(a => a.name).join(', ') || 'Unknown',
          year: album.year || '',
          coverUrl: album.images?.[0]?.uri || '',
          discogsUrl: album.uri || ''
        });
        showToast('已添加到收藏', 'success');
      }
      
      saveFavorites(favorites);
      const btn = document.querySelector('.favorite-btn');
      if (btn) btn.classList.toggle('favorited');
    }

    function loadFavorites() {
      const favorites = getFavorites();
      const list = document.getElementById('favorites-list');
      
      if (favorites.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">❤️</div>
            <h2>暂无收藏</h2>
            <p>搜索并收藏你喜欢的专辑</p>
            <p style="margin-top: 16px;"><a href="#" onclick="showPage('home'); return false;">开始搜索</a></p>
          </div>
        `;
        return;
      }

      list.innerHTML = `
        <div class="album-grid">
          ${favorites.map(item => `
            <div class="album-card" onclick="showAlbum('${item.id}')">
              <div class="album-cover">
                ${item.coverUrl ? `<img src="${item.coverUrl}" alt="${item.title}">` : '<span style="color: #666;">🎵</span>'}
              </div>
              <div class="album-info">
                <div class="album-title">${item.title}</div>
                <div class="album-artist">${item.artist}</div>
                <div class="album-year">${item.year}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function addToHistory(album) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
      const filtered = history.filter(h => h.id !== String(album.id));
      filtered.unshift({
        id: String(album.id),
        title: album.title,
        artist: album.artists?.map(a => a.name).join(', ') || 'Unknown',
        year: album.year || '',
        coverUrl: album.images?.[0]?.uri || '',
        viewedAt: Date.now()
      });
      localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(filtered.slice(0, 50)));
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
      const list = document.getElementById('history-list');
      
      if (history.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">🕐</div>
            <h2>暂无历史记录</h2>
            <p>你浏览过的专辑会显示在这里</p>
            <p style="margin-top: 16px;"><a href="#" onclick="showPage('home'); return false;">开始搜索</a></p>
          </div>
        `;
        return;
      }

      list.innerHTML = `
        <div class="album-grid">
          ${history.map(item => `
            <div class="album-card" onclick="showAlbum('${item.id}')">
              <div class="album-cover">
                ${item.coverUrl ? `<img src="${item.coverUrl}" alt="${item.title}">` : '<span style="color: #666;">🎵</span>'}
              </div>
              <div class="album-info">
                <div class="album-title">${item.title}</div>
                <div class="album-artist">${item.artist}</div>
                <div class="album-year">${item.year}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function saveSettings() {
      const discogsToken = document.getElementById('discogs-token').value.trim();
      const zhipuKey = document.getElementById('zhipu-key').value.trim();
      
      localStorage.setItem(STORAGE_KEYS.DISCOGS_TOKEN, discogsToken);
      localStorage.setItem(STORAGE_KEYS.ZHIPU_KEY, zhipuKey);
      showToast('设置已保存', 'success');
    }

    function resetSettings() {
      if (!confirm('确定要重置所有设置吗？')) return;
      localStorage.removeItem(STORAGE_KEYS.DISCOGS_TOKEN);
      localStorage.removeItem(STORAGE_KEYS.ZHIPU_KEY);
      document.getElementById('discogs-token').value = '';
      document.getElementById('zhipu-key').value = '';
      showToast('设置已重置');
    }

    function openLinkModal() {
      document.getElementById('link-modal').style.display = 'flex';
      navigator.clipboard.readText().then(text => {
        document.getElementById('link-input').value = text;
      }).catch(() => {});
    }

    function closeLinkModal() {
      document.getElementById('link-modal').style.display = 'none';
    }

    function handleLinkSubmit() {
      const link = document.getElementById('link-input').value.trim();
      if (!link) {
        showToast('请输入链接', 'error');
        return;
      }

      const discogsMatch = link.match(/discogs\.com.*release\/(\d+)/);
      if (discogsMatch) {
        closeLinkModal();
        showAlbum(discogsMatch[1]);
        return;
      }

      const neteaseMatch = link.match(/music\.163\.com.*album.*id=(\d+)/);
      if (neteaseMatch) {
        showToast('网易云音乐链接解析功能开发中', 'error');
        return;
      }

      showToast('暂不支持此链接类型', 'error');
    }

    function handleImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const token = getToken();
      const zhipuKey = localStorage.getItem(STORAGE_KEYS.ZHIPU_KEY);
      
      if (!zhipuKey) {
        showToast('请先在设置页面配置智谱 AI Key', 'error');
        event.target.value = '';
        return;
      }

      if (!token) {
        showToast('请先在设置页面配置 Discogs Token', 'error');
        event.target.value = '';
        return;
      }

      showToast('正在识别图片中的文字...', 'info');

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Image = e.target.result.split(',')[1];
        
        try {
          const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${zhipuKey}`,
            },
            body: JSON.stringify({
              model: 'glm-4v',
              messages: [
                {
                  role: 'user',
                  content: [
                    {
                      type: 'image_url',
                      image_url: {
                        url: `data:image/jpeg;base64,${base64Image}`
                      }
                    },
                    {
                      type: 'text',
                      text: '请识别这张图片中的所有文字，这是黑胶唱片的封面图片。请提取出艺术家名称和专辑名称。如果有多个文字，请选择最突出的那个。直接返回识别结果，格式为：艺术家 - 专辑名。如果无法识别出有意义的内容，请返回空字符串。'
                    }
                  ]
                }
              ]
            })
          });

          if (!response.ok) {
            throw new Error('识别失败');
          }

          const data = await response.json();
          const result = data.choices?.[0]?.message?.content?.trim();

          if (result && result.length > 0) {
            showToast('识别成功：' + result, 'success');
            document.getElementById('search-input').value = result;
            event.target.value = '';
            setTimeout(() => search(), 1000);
          } else {
            showToast('无法识别图片中的文字，请尝试其他图片或手动输入', 'error');
            event.target.value = '';
          }
        } catch (err) {
          console.error('OCR Error:', err);
          showToast('图片识别失败，请检查智谱 AI Key 是否正确', 'error');
          event.target.value = '';
        }
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem(STORAGE_KEYS.DISCOGS_TOKEN);
      const zhipuKey = localStorage.getItem(STORAGE_KEYS.ZHIPU_KEY);
      if (token) document.getElementById('discogs-token').value = token;
      if (zhipuKey) document.getElementById('zhipu-key').value = zhipuKey;
    });
  </script>
</body>
</html>
